[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-win-predictor"
description = "Predicts NBA regular-season game winners from team form and advanced stats."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.3.3",
    "pyarrow==19.0.0",
    "xgboost==3.1.2",
    "scikit-learn==1.6.1",
    "scipy==1.15.3",
    "bayesian-optimization==3.2.0",
    "joblib==1.4.2",
    "matplotlib==3.10.6",
    "seaborn==0.13.2",
    "streamlit==1.45.1",
    "plotly==6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
